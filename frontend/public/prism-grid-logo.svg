<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#050508" rx="8"/>
  
  <!-- Define gradient for prismatic effect -->
  <defs>
    <linearGradient id="prismGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a55c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a7a45;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="prismGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8884a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af7f;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGlow">
      <stop offset="0%" style="stop-color:#c9a55c;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#c9a55c;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer grid lines -->
  <g stroke="#c9a55c" stroke-width="1" opacity="0.3">
    <line x1="50" y1="20" x2="50" y2="180" />
    <line x1="100" y1="20" x2="100" y2="180" />
    <line x1="150" y1="20" x2="150" y2="180" />
    <line x1="20" y1="50" x2="180" y2="50" />
    <line x1="20" y1="100" x2="180" y2="100" />
    <line x1="20" y1="150" x2="180" y2="150" />
  </g>

  <!-- Prismatic diamond shapes - top left -->
  <polygon points="60,40 80,50 70,70 50,60" fill="url(#prismGradient1)" opacity="0.9"/>
  
  <!-- Prismatic diamond shapes - top right -->
  <polygon points="140,45 160,55 150,75 130,65" fill="url(#prismGradient2)" opacity="0.9"/>
  
  <!-- Central prismatic hexagon -->
  <g filter="url(#glow)">
    <polygon points="100,50 130,65 130,95 100,110 70,95 70,65" 
             fill="url(#prismGradient1)" opacity="0.85" stroke="#c9a55c" stroke-width="1.5"/>
  </g>

  <!-- Prismatic shapes - bottom left -->
  <polygon points="50,130 70,120 80,140 60,150" fill="url(#prismGradient2)" opacity="0.85"/>
  
  <!-- Prismatic shapes - bottom right -->
  <polygon points="150,125 170,115 180,135 160,145" fill="url(#prismGradient1)" opacity="0.85"/>

  <!-- Center accent circle with glow -->
  <circle cx="100" cy="80" r="12" fill="url(#centerGlow)"/>
  <circle cx="100" cy="80" r="10" fill="none" stroke="#c9a55c" stroke-width="1.5" opacity="0.8"/>

  <!-- Connecting lines for grid effect -->
  <g stroke="#c9a55c" stroke-width="0.8" opacity="0.4">
    <line x1="60" y1="40" x2="100" y2="80" />
    <line x1="140" y1="45" x2="100" y2="80" />
    <line x1="60" y1="150" x2="100" y2="80" />
    <line x1="160" y1="145" x2="100" y2="80" />
  </g>

  <!-- Subtle corner accents -->
  <rect x="18" y="18" width="8" height="8" fill="#c9a55c" opacity="0.5" rx="1"/>
  <rect x="174" y="18" width="8" height="8" fill="#c9a55c" opacity="0.5" rx="1"/>
  <rect x="18" y="174" width="8" height="8" fill="#c9a55c" opacity="0.5" rx="1"/>
  <rect x="174" y="174" width="8" height="8" fill="#c9a55c" opacity="0.5" rx="1"/>
</svg>
